<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AXIOM — Character</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #04080f; overflow: hidden; }
canvas { display: block; width: 100vw; height: 100vh; }
#info {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
  color: rgba(232,152,10,0.8); font-family: monospace; font-size: 11px;
  letter-spacing: 0.1em; text-align: center; pointer-events: none;
}
#btns {
  position: fixed; bottom: 44px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 8px;
}
button {
  background: rgba(7,13,22,0.9); border: 1px solid rgba(42,143,168,0.4);
  color: rgba(192,216,224,0.9); padding: 6px 16px;
  font-family: monospace; font-size: 10px; letter-spacing: 0.15em;
  cursor: pointer; text-transform: uppercase;
}
button.on { border-color: rgba(232,152,10,0.8); color: #e8980a; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">Loading...</div>
<div id="btns">
  <button class="on" onclick="play('idle',this)">Idle</button>
  <button onclick="play('talking',this)">Talking</button>
  <button onclick="play('typing',this)">Typing</button>
  <button onclick="play('walking',this)">Walking</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const BASE = 'https://162.243.225.72.nip.io/static/';

function loadScript(url) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = url; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}

let scene, cam, renderer, controls, mixer, clock;
let anims = {}, curAction = null;

async function init() {
  await loadScript('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js');
  await loadScript('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js');

  const canvas = document.getElementById('c');
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x04080f);
  clock = new THREE.Clock();

  // Lights
  scene.add(new THREE.AmbientLight(0xffffff, 1.5));
  const dir = new THREE.DirectionalLight(0xffffff, 2.0);
  dir.position.set(5, 10, 5);
  dir.castShadow = true;
  scene.add(dir);

  // Grid for reference
  scene.add(new THREE.GridHelper(10, 10, 0x1a3a4a, 0x0d1f2d));
  scene.add(new THREE.AxesHelper(2));

  // Load model first to get dimensions
  const loader = new THREE.GLTFLoader();
  document.getElementById('info').textContent = 'Loading character...';

  const gltf = await new Promise((res, rej) => loader.load(BASE + 'idle.glb', res, null, rej));
  const model = gltf.scene;

  // Step 1: get raw size
  const rawBox = new THREE.Box3().setFromObject(model);
  const rawSize = rawBox.getSize(new THREE.Vector3());
  console.log('Raw size:', rawSize.x.toFixed(5), rawSize.y.toFixed(5), rawSize.z.toFixed(5));

  // Step 2: scale so tallest dimension = 1.8 units
  const tallest = Math.max(rawSize.x, rawSize.y, rawSize.z);
  const scale = 1.8 / tallest;
  model.scale.setScalar(scale);
  model.updateMatrixWorld(true);

  // Step 3: get scaled box
  const scaledBox = new THREE.Box3().setFromObject(model);
  const scaledSize = scaledBox.getSize(new THREE.Vector3());
  const scaledCenter = scaledBox.getCenter(new THREE.Vector3());
  console.log('Scaled size:', scaledSize.x.toFixed(3), scaledSize.y.toFixed(3), scaledSize.z.toFixed(3));
  console.log('Scaled center:', scaledCenter.x.toFixed(3), scaledCenter.y.toFixed(3), scaledCenter.z.toFixed(3));
  console.log('Scaled min.y:', scaledBox.min.y.toFixed(3), 'max.y:', scaledBox.max.y.toFixed(3));

  // Step 4: move feet to y=0
  model.position.y = -scaledBox.min.y;
  model.updateMatrixWorld(true);

  // Step 5: recheck
  const finalBox = new THREE.Box3().setFromObject(model);
  const finalCenter = finalBox.getCenter(new THREE.Vector3());
  console.log('Final center:', finalCenter.x.toFixed(3), finalCenter.y.toFixed(3), finalCenter.z.toFixed(3));
  console.log('Final min.y:', finalBox.min.y.toFixed(3), 'max.y:', finalBox.max.y.toFixed(3));

  scene.add(model);

  // Step 6: NOW set up camera based on final scaled model
  // Character is 1.8 units tall, centered at x=0, y=0.9, z=~0
  const charHeight = finalBox.max.y - finalBox.min.y; // should be ~1.8
  const charWidth  = Math.max(scaledSize.x, scaledSize.z);
  const midY       = finalCenter.y; // ~0.9

  // Camera: pull back far enough to see full height
  // FOV 45 → tan(22.5°) = 0.414
  // To fit height 1.8 with padding: dist = (1.8/2) / tan(22.5°) * 1.4 = ~3.0
  const fovRad = 45 * Math.PI / 180;
  const dist   = (charHeight / 2 / Math.tan(fovRad / 2)) * 1.5;
  console.log('Camera dist:', dist.toFixed(3), 'midY:', midY.toFixed(3));

  // Camera
  cam = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 1000);
  cam.position.set(0, midY, dist);
  cam.lookAt(0, midY, 0);

  // Renderer
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;

  // Orbit controls — target at character center
  controls = new THREE.OrbitControls(cam, canvas);
  controls.target.set(0, midY, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.update();

  document.getElementById('info').textContent =
    `Character loaded · ${charHeight.toFixed(2)}m tall · scroll to zoom`;

  // Animations
  mixer = new THREE.AnimationMixer(model);
  if (gltf.animations.length > 0) {
    anims.idle = mixer.clipAction(gltf.animations[0]);
    anims.idle.play();
    curAction = anims.idle;
  }

  for (const name of ['talking', 'typing', 'walking']) {
    loader.load(BASE + name + '.glb', g => {
      if (g.animations.length > 0) anims[name] = mixer.clipAction(g.animations[0]);
    });
  }

  window.addEventListener('resize', () => {
    cam.aspect = innerWidth / innerHeight;
    cam.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  loop();
}

function play(name, btn) {
  if (!mixer || !anims[name]) return;
  if (curAction) curAction.fadeOut(0.25);
  anims[name].reset().fadeIn(0.25).play();
  curAction = anims[name];
  document.querySelectorAll('button').forEach(b => b.classList.remove('on'));
  if (btn) btn.classList.add('on');
}

function loop() {
  requestAnimationFrame(loop);
  if (mixer) mixer.update(clock.getDelta());
  controls.update();
  renderer.render(scene, cam);
}

init().catch(e => {
  console.error(e);
  document.getElementById('info').textContent = 'Error: ' + e.message;
});
</script>
</body>
</html>
