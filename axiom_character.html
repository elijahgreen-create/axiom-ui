<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AXIOM — Character</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #04080f; overflow: hidden; }
canvas { display: block; width: 100vw; height: 100vh; }
#info {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
  color: rgba(232,152,10,0.8); font-family: monospace; font-size: 11px;
  letter-spacing: 0.1em; text-align: center; pointer-events: none;
}
#readout {
  position: fixed; top: 16px; left: 16px;
  color: rgba(42,200,168,0.9); font-family: monospace; font-size: 11px;
  line-height: 1.8; letter-spacing: 0.08em;
  background: rgba(4,8,15,0.8); padding: 10px 14px;
  border: 1px solid rgba(42,143,168,0.3); pointer-events: none;
}
#copybox {
  position: fixed; top: 16px; right: 16px;
  color: rgba(232,152,10,0.9); font-family: monospace; font-size: 10px;
  line-height: 2; letter-spacing: 0.08em;
  background: rgba(4,8,15,0.8); padding: 10px 14px;
  border: 1px solid rgba(232,152,10,0.3); pointer-events: none;
  white-space: pre;
}
#btns {
  position: fixed; bottom: 44px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 8px;
}
button {
  background: rgba(7,13,22,0.9); border: 1px solid rgba(42,143,168,0.4);
  color: rgba(192,216,224,0.9); padding: 6px 16px;
  font-family: monospace; font-size: 10px; letter-spacing: 0.15em;
  cursor: pointer; text-transform: uppercase;
}
button.on { border-color: rgba(232,152,10,0.8); color: #e8980a; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">Loading...</div>
<div id="readout">Loading...</div>
<div id="copybox">Paste these into tuning block:</div>
<div id="btns">
  <button class="on" onclick="play('idle',this)">Idle</button>
  <button onclick="play('talking',this)">Talking</button>
  <button onclick="play('typing',this)">Typing</button>
  <button onclick="play('walking',this)">Walking</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

// ═══════════════════════════════════════════════════════════════
// ██████  TUNE THESE VALUES  ████████████████████████████████████
// ═══════════════════════════════════════════════════════════════

const ROTATION_X = -1.5708;  // Rotate model on X axis. Try: 0, 1.5708, -1.5708, 3.1416
const ROTATION_Y = 0;         // Rotate model on Y axis. Try: 0, 1.5708, 3.1416
const ROTATION_Z = 0;         // Rotate model on Z axis. Try: 0, 1.5708, 3.1416

const MODEL_SCALE = 105.88;   // Scale of the model. Bigger = larger character.

const CAM_X      = 0;         // Camera left/right. 0 = center
const CAM_Y      = 0.9;       // Camera up/down. Higher = looking from above
const CAM_Z      = 3.5;       // Camera distance. Larger = further away
const CAM_FOV    = 45;        // Field of view. Smaller = more zoomed in

const LOOK_X     = 0;         // Look target left/right
const LOOK_Y     = 0.9;       // Look target up/down. Match CAM_Y for flat view
const LOOK_Z     = 0;         // Look target depth

const SHOW_GRID  = false;      // Show grid? true or false
const SHOW_AXES  = false;      // Show X/Y/Z axes? true or false

// ═══════════════════════════════════════════════════════════════
// END OF TUNING — don't edit below unless you know what you're doing
// ═══════════════════════════════════════════════════════════════

const BASE = 'https://162.243.225.72.nip.io/static/';

function loadScript(url) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = url; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}

let scene, cam, renderer, controls, mixer, clock;
let anims = {}, curAction = null;

async function init() {
  await loadScript('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js');
  await loadScript('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js');

  const canvas = document.getElementById('c');
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x04080f);
  clock = new THREE.Clock();

  // Lights
  scene.add(new THREE.AmbientLight(0xffffff, 1.5));
  const dir = new THREE.DirectionalLight(0xffffff, 2.0);
  dir.position.set(5, 10, 5); dir.castShadow = true;
  scene.add(dir);

  if (SHOW_GRID) scene.add(new THREE.GridHelper(10, 10, 0x1a3a4a, 0x0d1f2d));
  if (SHOW_AXES) scene.add(new THREE.AxesHelper(2));

  // Camera
  cam = new THREE.PerspectiveCamera(CAM_FOV, innerWidth / innerHeight, 0.001, 1000);
  cam.position.set(CAM_X, CAM_Y, CAM_Z);
  cam.lookAt(LOOK_X, LOOK_Y, LOOK_Z);

  // Renderer
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;

  // Orbit controls
  controls = new THREE.OrbitControls(cam, canvas);
  controls.target.set(LOOK_X, LOOK_Y, LOOK_Z);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.update();

  // Load model
  const loader = new THREE.GLTFLoader();
  document.getElementById('info').textContent = 'Loading character...';

  loader.load(BASE + 'idle.glb',
    (gltf) => {
      const model = gltf.scene;

      // Apply rotation from tuning block
      model.rotation.x = ROTATION_X;
      model.rotation.y = ROTATION_Y;
      model.rotation.z = ROTATION_Z;

      // Apply scale from tuning block
      model.scale.setScalar(MODEL_SCALE);
      model.updateMatrixWorld(true);

      // Log final position for tuning
      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      console.log('=== CHARACTER INFO ===');
      console.log('Size:  ', size.x.toFixed(2), 'x', size.y.toFixed(2), 'x', size.z.toFixed(2));
      console.log('Center:', center.x.toFixed(2), center.y.toFixed(2), center.z.toFixed(2));
      console.log('Feet (min.y):', box.min.y.toFixed(2), '| Head (max.y):', box.max.y.toFixed(2));
      console.log('Camera:', cam.position.x.toFixed(2), cam.position.y.toFixed(2), cam.position.z.toFixed(2));

      model.traverse(c => { if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; } });
      window._model = model;
      scene.add(model);

      document.getElementById('info').textContent =
        `h:${size.y.toFixed(2)} w:${size.x.toFixed(2)} | cam z:${CAM_Z} y:${CAM_Y} | fov:${CAM_FOV}`;

      // Animations
      mixer = new THREE.AnimationMixer(model);
      if (gltf.animations.length > 0) {
        anims.idle = mixer.clipAction(gltf.animations[0]);
        anims.idle.play();
        curAction = anims.idle;
      }

      for (const name of ['talking', 'typing', 'walking']) {
        loader.load(BASE + name + '.glb', g => {
          if (g.animations.length > 0) anims[name] = mixer.clipAction(g.animations[0]);
        });
      }
    },
    null,
    (err) => { console.error(err); document.getElementById('info').textContent = 'Error: ' + err.message; }
  );

  window.addEventListener('resize', () => {
    cam.aspect = innerWidth / innerHeight;
    cam.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  loop();
}

function play(name, btn) {
  if (!mixer || !anims[name]) return;
  if (curAction) curAction.fadeOut(0.25);
  anims[name].reset().fadeIn(0.25).play();
  curAction = anims[name];
  document.querySelectorAll('button').forEach(b => b.classList.remove('on'));
  if (btn) btn.classList.add('on');
}

function loop() {
  requestAnimationFrame(loop);
  if (mixer) mixer.update(clock.getDelta());
  controls.update();
  renderer.render(scene, cam);

  // Live readout
  const r = document.getElementById('readout');
  const c = document.getElementById('copybox');
  if (r) {
    r.innerHTML =
      `CAM_X: ${cam.position.x.toFixed(4)}<br>` +
      `CAM_Y: ${cam.position.y.toFixed(4)}<br>` +
      `CAM_Z: ${cam.position.z.toFixed(4)}<br>` +
      `LOOK_X: ${controls.target.x.toFixed(4)}<br>` +
      `LOOK_Y: ${controls.target.y.toFixed(4)}<br>` +
      `LOOK_Z: ${controls.target.z.toFixed(4)}`;
  }
  if (c && window._model) {
    c.textContent =
      'Paste these into tuning block:\n' +
      'const CAM_X  = ' + cam.position.x.toFixed(4) + ';\n' +
      'const CAM_Y  = ' + cam.position.y.toFixed(4) + ';\n' +
      'const CAM_Z  = ' + cam.position.z.toFixed(4) + ';\n' +
      'const LOOK_X = ' + controls.target.x.toFixed(4) + ';\n' +
      'const LOOK_Y = ' + controls.target.y.toFixed(4) + ';\n' +
      'const LOOK_Z = ' + controls.target.z.toFixed(4) + ';\n' +
      'const ROTATION_X = ' + window._model.rotation.x.toFixed(4) + ';\n' +
      'const ROTATION_Y = ' + window._model.rotation.y.toFixed(4) + ';\n' +
      'const ROTATION_Z = ' + window._model.rotation.z.toFixed(4) + ';';
  }
}

init().catch(e => {
  console.error(e);
  document.getElementById('info').textContent = 'Error: ' + e.message;
});
</script>
</body>
</html>
